<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equations Review and Clearing Drill</title>
<style>
/* Layout: matches the One-Step Equations drill. Header bar, equation entry, the work centered and
   scaled to fit, the prompt bar along the bottom. One light look, like the drill. */
:root{
  --ink:#0f172a; --line:#1e293b; --muted:#64748b; --faint:#94a3b8; --prompt:#334155; --slate:#475569;
  --blue:#1d4ed8; --blue-b:#3b82f6; --blue-bg:#eff6ff; --blue-edge:#bfdbfe;
  --green:#059669; --green-b:#10b981; --green-bg:#ecfdf5;
  --rose:#e11d48; --rose-b:#fb7185; --rose-bg:#fff1f2;
  --ui:#047857; --ui-b:#10b981; --ui-bg:#ecfdf5; --ui-edge:#a7f3d0;
  --page:#f8fafc; --edge:#e2e8f0; --white:#ffffff;
  --hl:#fef08a; --hl-edge:#facc15; --pick:#fde047; --hover:#fef9c3;
  --sl-draw:#475569; --sl-dim:#a3aec0; --dim-text:#cbd5e1;
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
html{font-size:clamp(16px,1.15vw + .6vh,26px);}
body{background:var(--page);color:var(--ink);font-family:Tahoma,Verdana,Geneva,sans-serif;-webkit-font-smoothing:antialiased;}
button,input{font-family:Tahoma,Verdana,Geneva,sans-serif;}
.app{height:100%;display:flex;flex-direction:column;overflow:hidden;padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
.wrap{width:100%;max-width:120rem;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0;}

/* header */
.drillhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;
  flex-shrink:0;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--edge);}
.dh-name{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);}
.dh-right{display:inline-flex;align-items:center;gap:12px;}
.dh-count{font-size:1rem;font-weight:700;color:var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap;}
.turnin-link{font-weight:700;font-size:.75rem;padding:4px 12px;border-radius:8px;cursor:pointer;
  background:var(--white);color:var(--ui);border:2px solid var(--ui-edge);}
.turnin-link:hover{border-color:var(--ui-b);background:var(--ui-bg);}

/* typing the equation */
.entry{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;flex-shrink:0;margin:0 auto 0 0;}
.entry .lbl{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);}
.box.eqbox{width:12rem;max-width:100%;height:1.9rem;font-size:1rem;text-align:left;padding:0 .5em;}
.entry .checkbtn{padding:4px 14px;font-size:.85rem;}
.entry-err{margin-top:6px;font-size:.95rem;color:var(--rose);flex-shrink:0;}
.tally{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:10px;font-size:.72rem;
  color:var(--faint);font-variant-numeric:tabular-nums;flex-shrink:0;}
.tally span{white-space:nowrap;}
.tally .done{color:var(--muted);}
.tally .done b{color:var(--green);}
.tally .on{color:var(--blue);font-weight:700;}
.tally b{font-weight:700;margin-right:3px;}

/* work area */
.work{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4vh 0 8px;overflow-x:hidden;overflow-y:auto;}
.fitbox{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;}
.scroller{width:100%;}
.scroller.stack3{width:max-content;margin:0 auto;}
.scroller.stack3 > .eq{margin:0;}
.eq.prevwork,.eq.prework{margin-bottom:10px;}
.prewrap[hidden]{display:none;}
.prewrap > .eq{margin:0 0 10px 0;}
.eq.vsgrid{column-gap:24px;row-gap:12px;padding:6px 14px;}
.eq.vsgrid .cell{justify-content:center;}
.eq.vsgrid .box{width:2.9em;height:1.25em;font-size:.8em;}
.eq .divsign{margin:0 .3em;}
.eq .tgt.picked{background:var(--hl);box-shadow:0 0 0 3px var(--hl);border-radius:8px;}
#pre{transition:opacity .5s ease;}
#pre.chk-fade{opacity:.15;}
.eq.k-pre{grid-template-columns:auto auto auto;row-gap:12px;padding:6px 14px;}
.eq.k-pre .cell{display:block;line-height:1.6;}
.eq.k-pre .cell:nth-child(3n+1){text-align:right;}
.eq.k-pre .cell:nth-child(3n+2){text-align:center;}
.eq.k-pre .cell:nth-child(3n){text-align:left;}
.eq.k-pre .cell.arcrow{padding-top:.8em;}
.eq .hk{border-radius:8px;padding:0 .08em;}
.eq .hk.hl1{background:#fde68a;box-shadow:0 0 0 3px #fde68a;}
.eq .hk.hl2{background:#bbf7d0;box-shadow:0 0 0 3px #bbf7d0;}
.eq .hk.hl3{background:#fbcfe8;box-shadow:0 0 0 3px #fbcfe8;}
.eq .hk.hl4{background:#ddd6fe;box-shadow:0 0 0 3px #ddd6fe;}
.eq .box.hlb4{border-color:#8b5cf6;background:#f5f3ff;}
/* cancelling a fraction in place: a small box above the LCD and below the bottom number */
.cxw{position:relative;display:inline-block;}
.cxw .cxs{position:absolute;left:50%;transform:translateX(-50%);font-size:.55em;line-height:1;white-space:nowrap;color:var(--blue);}
.cxw.cxt .cxs{bottom:88%;}
.cxw.cxb .cxs{top:88%;}
.eq.k-pre .cxw .box{width:2.1em;height:1.35em;font-size:1em;margin:0;padding:0;}
.cxw:not(:has(input)) .cxn,.cxw:has(input.ok) .cxn{color:var(--faint);
  background:linear-gradient(to bottom right,transparent calc(50% - 1.5px),var(--blue) calc(50% - 1.5px),var(--blue) calc(50% + 1.5px),transparent calc(50% + 1.5px));}
.eq.k-pre .cell.cxrow{padding-top:.9em;padding-bottom:.9em;}
/* room in front of each term for the LCD, kept from the first line on so nothing moves when it is written in */
.eq .lcdw{display:inline-block;min-width:1.52em;text-align:right;}
.eq.k-pre .lcdw .box{width:1.9em;margin:0;padding:0 .1em;}
/* the problem is written with the room for the LCD and the parentheses already there, so it never moves */
.eq .pp.hide{visibility:hidden;}
.eq .pp.new{color:var(--blue);}
/* the "do to both sides" box, under the term it gets rid of */
.eq .dofloat{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:3;}
.eq .dofloat .box,.eq .dofl .box{width:3.4em;height:1.25em;font-size:.8em;}
.eq.dopad{padding-bottom:2.4em;}
.eq .dofl{display:inline-flex;flex-direction:column;align-items:center;gap:2px;}
.eq .dolbl{font-size:.22em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.eq.k-pre .lcdw .box.mirror{display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.25em;font-size:.8em;vertical-align:middle;box-sizing:border-box;opacity:.85;}
.cross-btn{margin-right:8px;}
.cross-btn.off{color:var(--muted);border-color:var(--edge);background:#fff;}
.eq .cell.cxrow .hk{padding:0;}
.lcdpanel .lbl{font-size:.55em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.lcdpanel .dens{display:inline-flex;gap:8px;}
.lcdpanel .d{border:1px solid var(--edge,#e2e8f0);background:#fff;border-radius:6px;padding:0 .35em;}
.lcdpanel .box{height:2.9rem;width:4.8rem;font-size:1.6rem;}
.lcdpanel .box.hlb1{border-color:#eab308;background:#fefce8;}
.eq .hk.hl5{background:#fed7aa;box-shadow:0 0 0 3px #fed7aa;}
.eq .box.hlb5{border-color:#f97316;background:#fff7ed;}
.eq .hk.hl6{background:#a5f3fc;box-shadow:0 0 0 3px #a5f3fc;}
.eq .box.hlb6{border-color:#06b6d4;background:#ecfeff;}
.eq .box.hlb1{border-color:#eab308;background:#fefce8;}
.eq .box.hlb2{border-color:#22c55e;background:#f0fdf4;}
.eq .box.hlb3{border-color:#ec4899;background:#fdf2f8;}
.arcs{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.arcs.blue{stroke:var(--blue);}
.eq.k-pre .box{width:2.9em;height:1.25em;font-size:.8em;vertical-align:middle;margin:0 .08em;}
.eq.prevwork[hidden]{display:none;}
#prev{transition:opacity .5s ease;}
#prev.chk-fade{opacity:.15;}
.eq{position:relative;display:grid;column-gap:30px;row-gap:10px;width:max-content;margin:0 auto;font-size:3.2rem;}
.eq.k-addsub{grid-template-columns:auto auto auto auto;row-gap:12px;}
.eq.k-muldiv{grid-template-columns:auto auto auto;}
.cell{min-height:5.2rem;padding:2px 0;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .7s ease-out;white-space:nowrap;}
.eq.k-addsub .cell{justify-content:flex-end;gap:.32em;}
.eq.k-addsub .cell.eqsign{justify-content:center;}
.rule{grid-column:1 / -1;height:2px;margin:5px 0;border-top:2px solid var(--line);}
.rule.blue{border-top-color:var(--blue);}
.spacer{grid-column:1 / -1;height:0;margin:9px 0;}
.eqsign{color:var(--faint);}
.blue{color:var(--blue);}
.green{color:var(--green);}
.faint{color:var(--faint);}
.cancelling{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6;}
.struck{text-decoration:line-through;text-decoration-thickness:2px;opacity:.25;}
.fresh{animation:grow .35s ease-out;}

/* fractions */
.stack{display:inline-flex;flex-direction:column;align-items:center;margin:0 3px;font-size:.66em;line-height:1.18;vertical-align:-.44em;}
.eq .stack,.checkline .stack{font-size:.9em;}
.stack .t,.stack .b{padding:0 5px;}
.stack .bar{width:100%;border-top:2px solid currentColor;margin:.14em 0;}
.dfrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 1px;font-size:.86em;}
.dfrac > .t,.dfrac > .b{padding:0 8px;display:flex;align-items:center;justify-content:center;}
.dfrac > .bar{width:100%;min-width:1.4rem;border-top:2px solid currentColor;margin:4px 0;}
.eq.k-muldiv .dfrac{font-size:1em;}
.eq.k-muldiv .dfrac.wide > .bar{min-width:5rem;}
.dfrac > .bar.blue{border-top-color:var(--blue);}
.prompt .dfrac{font-size:.72em;line-height:1.05;}
.prompt .dfrac > .bar{min-width:.7rem;margin:2px 0;}
.prompt .dfrac > .t,.prompt .dfrac > .b{padding:0 3px;}

/* multiplying both sides */
.mgroup{display:inline-flex;align-items:center;gap:5px;}
.paren{font-size:1.35em;line-height:1;color:var(--line);}
.mgroup.tall .paren{font-size:2.4em;font-weight:300;}
.blue .paren,.paren.blue{color:var(--blue);}
@keyframes grow{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

/* crossing out a pair that cancels */
.slash{display:inline-flex;align-items:center;justify-content:center;padding:0 .18em;
  background-repeat:no-repeat;background-position:center;background-size:100% 100%;
  background-image:linear-gradient(to bottom right, transparent calc(50% - 1.8px), var(--sl) calc(50% - 1.8px),
    var(--sl) calc(50% + 1.8px), transparent calc(50% + 1.8px));}
.slash.draw{--sl:var(--blue);color:var(--faint);animation:draw .5s ease-out both;}
.slash.dim{--sl:var(--sl-dim);color:var(--dim-text);}
.pend{display:inline-flex;align-items:center;justify-content:center;padding:0 .18em;}
@keyframes draw{from{background-size:0% 100%;}to{background-size:100% 100%;}}

/* answer boxes */
.box{height:3.6rem;width:4.8rem;border:2px solid var(--blue-b);background:var(--blue-bg);color:var(--blue);
  border-radius:6px;text-align:center;font-size:2.3rem;outline:none;transition:border-color .15s,background .15s;}
.box.wide{width:6.4rem;}
.eq .mixnum .dfrac{margin-left:.12em;}
.box:focus{border-color:var(--blue);background:var(--white);}
.box.bad{border-color:var(--rose-b);background:var(--rose-bg);color:var(--rose);}
.box.ok{border-color:var(--green-b);background:var(--green-bg);color:var(--green);}
.sgn{display:inline-flex;align-items:center;gap:.32em;}

/* the answer, boxed at the end */
.ansbox{position:absolute;border:3px solid var(--green);border-radius:12px;pointer-events:none;}
.ansbox.now{border-color:var(--blue);animation:grow .4s ease-out;}
.checkline.fresh{color:var(--blue);}

/* operation buttons */
.ops{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;}
.op{position:relative;width:7rem;height:5.6rem;border:2px solid var(--edge);background:var(--white);color:var(--line);
  border-radius:12px;cursor:pointer;font-size:2.9rem;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s,transform .1s;}
.op .key{position:absolute;top:5px;left:8px;font-size:.75rem;color:var(--faint);font-weight:600;}
.op:hover{border-color:var(--blue-b);background:var(--blue-bg);color:var(--blue);}
.op:active{transform:translateY(1px);}
.op:focus-visible{outline:3px solid var(--blue-b);outline-offset:2px;}
.op.shake{animation:shake .32s;border-color:var(--rose-b);background:var(--rose-bg);color:var(--rose);}

/* first step: tap the part that's in the way */
.tgt{display:inline-flex;align-items:center;justify-content:center;gap:inherit;padding:2px 8px;border-radius:10px;
  transition:background .15s,color .15s;}
.tgt[role=button]{cursor:pointer;}
.tgt[role=button]:hover,.tgt.hov{background:var(--hover);}
.tgt[role=button]:focus-visible{outline:3px solid var(--blue-b);outline-offset:2px;}
.tgt.picked{background:var(--pick);color:var(--ink);}
.tgt.shake{animation:shake .32s;background:var(--rose-bg);color:var(--rose);}
@keyframes shake{0%,100%{transform:none;}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}

/* the check */
.checkline{width:100%;text-align:center;font-size:1.8rem;line-height:2.1;}
.checkline .cl-lab{font-size:.95rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);line-height:1.4;}
.checkline .box{height:2.9rem;width:4.8rem;font-size:1.8rem;vertical-align:middle;}
.chk-hl{display:inline-block;background:var(--hl);border-radius:8px;padding:2px 8px;box-shadow:0 0 0 2px var(--hl-edge);line-height:1.5;}

/* Check button and notes */
.actions{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:1.6rem;}
.checkbtn{background:var(--ui);color:var(--white);border:none;border-radius:10px;padding:10px 26px;font-size:1.1rem;font-weight:600;cursor:pointer;}
.checkbtn:hover{background:#065f46;}
.checkbtn:focus-visible{outline:3px solid var(--ui-b);outline-offset:2px;}
.notebar{min-height:1.3em;font-size:1rem;color:var(--muted);text-align:center;}

/* prompt bar */
.main{flex:1;min-height:0;display:flex;gap:28px;margin-top:10px;}
.side{flex:0 0 clamp(16rem,27%,24rem);display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;padding-bottom:6px;}
.side .story{margin-top:0;}
.side .promptbar{border-top:none;border-left:4px solid var(--edge);padding:6px 0 6px 14px;min-height:0;}
.side .row-between{flex-direction:column;align-items:flex-start;gap:14px;}
.side .hint1{text-align:left;padding:2px 0;}
.side .keyhelp{justify-content:flex-start;flex-direction:column;align-items:flex-start;gap:6px;}
.side .ownbtns{flex-wrap:wrap;}
.main .work{flex:1;min-width:0;}
@media (max-width:900px){
  .main{flex-direction:column;gap:0;margin-top:0;}
  .side{display:contents;}
  .side .story{order:0;margin-top:10px;}
  .main .work{order:1;}
  .side .promptbar{order:2;border-left:none;border-top:1px solid var(--edge);padding:12px 0 4px;min-height:4.6rem;}
  .side .row-between{flex-direction:row;align-items:center;}
  .side .hint1{text-align:center;}
  .side .keyhelp{flex-direction:row;justify-content:center;gap:6px 22px;}
}
.promptbar{flex-shrink:0;border-top:1px solid var(--edge);padding-top:12px;padding-bottom:4px;min-height:4.6rem;}
.prompt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;color:var(--prompt);font-size:1.35rem;line-height:1.5;}
.prompt strong{font-weight:600;}
.prompt .math{white-space:nowrap;}
.prompt .tag{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--blue);}
.link{background:none;border:none;padding:0;color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:4px;cursor:pointer;}
.link:hover{color:var(--ink);}
.link.strong{color:var(--blue);font-weight:700;}
.leadline{font-size:1.05rem;color:var(--green);margin-bottom:6px;}
.missline{margin-top:6px;font-size:1.05rem;color:var(--rose);}
.next{background:var(--ink);color:var(--white);border:none;border-radius:8px;padding:12px 24px;font-size:1.1rem;font-weight:500;cursor:pointer;white-space:nowrap;}
.next:hover{background:var(--line);}
.next:focus-visible{outline:3px solid var(--ui-b);outline-offset:2px;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;}
.keys{font-size:.85rem;color:var(--faint);}
.panel{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;font-size:1.7rem;}
.panel .lbl{font-size:1rem;font-weight:700;letter-spacing:.08em;color:var(--muted);}
.nhl{display:inline-flex;align-items:center;background:var(--hl);color:var(--ink);border-radius:8px;padding:0 6px;box-shadow:0 0 0 2px var(--hl-edge);}
.nhl.now{color:var(--blue);}
.eq .old{color:var(--faint);}
.ghost{visibility:hidden;}
.dnum{display:inline;white-space:nowrap;}
.eq{font-variant-numeric:tabular-nums;}
/* the word problem for the question on screen */
.story{flex-shrink:0;margin-top:10px;padding:10px 14px;border-left:4px solid var(--ui-b);background:var(--ui-bg);
  border-radius:0 10px 10px 0;font-size:1.05rem;line-height:1.5;color:var(--prompt);}
.story[hidden]{display:none;}
.story-lab{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--ui);margin-bottom:2px;}
.story-txt{display:block;}
.story-txt .stack{font-size:.78em;line-height:1.05;vertical-align:middle;}
.story .model{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-weight:600;color:var(--ink);}
.story .model .stack{font-size:.9em;vertical-align:middle;}
@media (max-width:640px){ .story{font-size:.9rem;padding:8px 10px;} }
.qstrip{display:flex;flex-wrap:nowrap;align-items:center;gap:2px;margin-top:6px;flex-shrink:0;overflow-x:auto;scrollbar-width:thin;}
.qstrip .qlab2{margin-left:6px;}
.qstrip .qlab{flex-shrink:0;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:3px;white-space:nowrap;}
.qn{flex:1 0 auto;min-width:1.45em;height:1.4rem;padding:0 2px;border-radius:6px;border:1.5px solid var(--edge);background:var(--white);color:var(--muted);
  font-size:.66rem;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums;}
.qn:hover{border-color:var(--ui-b);color:var(--ui);}
.qn:focus-visible{outline:3px solid var(--ui-b);outline-offset:2px;}
.qn.done{color:var(--green);border-color:#a7f3d0;background:var(--green-bg);}
.qn.on{background:var(--ui);border-color:var(--ui);color:var(--white);}
.mixnum{display:inline-flex;align-items:center;}
.ceq{margin:0 .35em;}
.mixnum .stack{margin-left:4px;}
/* a number stuck to its letter (2b): no gap between them */
.tpair{display:inline-flex;align-items:center;gap:0;}
.tpair > .dfrac > .t,.tpair > .dfrac > .b,.tpair > * > .dfrac > .t,.tpair > * > .dfrac > .b{padding-right:2px;}
.tpair > .pend,.tpair > .slash{padding-right:0;}
.tpair .pend > .tgt,.tpair .slash > .tgt{padding-right:1px;}
.tpair > .tgt{padding-left:1px;}
.slash.big{background-image:none;}
.xslash{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
.xslash line{stroke:var(--slate);stroke-width:7;stroke-linecap:round;}
.xslash.done line{opacity:.6;}
.xslash.thin line{stroke-width:5;}
.xslash.draw line{stroke:var(--blue);animation:xdraw .55s ease-out both;}
@keyframes xdraw{from{stroke-dashoffset:var(--len);}to{stroke-dashoffset:0;}}
.badeq{max-width:30rem;font-size:1.3rem;line-height:1.5;color:var(--rose);text-align:center;white-space:normal;padding:1rem;}
.eq .cell{position:relative;}
.eq .chk-fade{opacity:.15 !important;transition:opacity .5s ease;}
.chk-fly{position:fixed;z-index:50;color:var(--green);font-family:Tahoma,Verdana,Geneva,sans-serif;line-height:1;pointer-events:none;
  transition:transform .85s cubic-bezier(.45,.05,.3,1);}
.chk-tick{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:.35em;color:var(--green);font-weight:700;}

<script>
/* ================= numbers ================= */
const MINUS = "−";
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a||1; }
function R(n,d){ if(d===undefined) d=1; if(d<0){ n=-n; d=-d; } const g=gcd(n,d); return {n:n/g, d:d/g}; }
function neg(a){ return {n:-a.n, d:a.d}; }
function absR(a){ return {n:Math.abs(a.n), d:a.d}; }
function addR(a,b){ return R(a.n*b.d + b.n*a.d, a.d*b.d); }
function subR(a,b){ return addR(a, neg(b)); }
function mulR(a,b){ return R(a.n*b.n, a.d*b.d); }
function divR(a,b){ return R(a.n*b.d, a.d*b.n); }
function same(a,b){ return a.n*b.d === b.n*a.d; }
function isNeg1(a){ return a.n===-1 && a.d===1; }
function numR(s){
  if(s.indexOf(".")>=0){ const p=s.split("."); const d=Math.pow(10,p[1].length); return R((+p[0]||0)*d + (+p[1]||0), d); }
  return R(+s);
}
function termR(s){ if(s.indexOf("/")>=0){ const p=s.split("/"); return +p[1] ? R(+p[0], +p[1]) : null; } return numR(s); }

let P = null;   /* the current problem */
function terminates(d){ while(d%2===0) d/=2; while(d%5===0) d/=5; return d===1; }
function decStr(r){ const s=(r.n/r.d).toFixed(6).replace(/0+$/,"").replace(/\.$/,""); return s==="-0" ? "0" : s; }
function asDec(r){ return P && P.dec && terminates(r.d); }
function plainT(r){
  if(r.d===1) return String(r.n);
  if(asDec(r)) return decStr(r);
  return (r.n<0?"-":"") + Math.abs(r.n) + "/" + r.d;
}
function stackH(t,b){ return '<span class="stack"><span class="t">'+t+'</span><span class="bar"></span><span class="b">'+b+'</span></span>'; }
function dfracH(t,b,cls,barCls){ return '<span class="dfrac'+(cls?' '+cls:'')+'"><span class="t">'+t+'</span><span class="bar'+(barCls?' '+barCls:'')+'"></span><span class="b">'+b+'</span></span>'; }
/* a number as written: whole numbers and decimals flat, fractions stacked */
function cm(n){ return n>=10000 ? n.toLocaleString("en-US") : String(n); }
function H(r){
  if(r.d===1) return (r.n<0?MINUS:"") + cm(Math.abs(r.n));
  if(asDec(r)) return (r.n<0?MINUS:"") + decStr(absR(r));
  return '<span class="sgn">'+(r.n<0?MINUS:"") + stackH(Math.abs(r.n), r.d)+'</span>';
}
function PH(r){ return r.n<0 ? "("+H(r)+")" : H(r); }

/* ================= reading the equation ================= */
const NUM = "(\\d+(?:\\.\\d*)?|\\.\\d+)";
const KT  = "(\\d+\\/\\d+|\\d+(?:\\.\\d*)?|\\.\\d+)";
function stripParens(s){ while(/^\([^()]*\)$/.test(s)) s=s.slice(1,-1); return s; }
function parseConst(s){
  s=stripParens(s); let m;
  if((m=s.match(/^([+-]?)(\d+)\/(\d+)$/))){ if(!+m[3]) return null; return R((m[1]==="-"?-1:1)*+m[2], +m[3]); }
  if((m=s.match(new RegExp("^([+-]?)"+NUM+"$")))){ const r=numR(m[2]); return m[1]==="-" ? neg(r) : r; }
  return null;
}
function parseVarSide(s,v){
  let m; const sg=function(x){ return x==="-" ? -1 : 1; };
  const re=function(x){ return new RegExp("^"+x+"$"); };
  const solved={err:"That one is already solved: "+v+" is by itself. Try something like "+v+" + 7 = 12."};
  if((m=s.match(re("\\+?"+v+"([+-])"+KT)))){
    const k=termR(m[2]); if(!k) return null; if(!k.n) return {err:"Adding 0 doesn't change anything. Try a different number."};
    return {kind:"add", k:m[1]==="-"?neg(k):k, varFirst:true};
  }
  if((m=s.match(re("([+-]?)"+KT+"\\+"+v)))){
    const k=termR(m[2]); if(!k) return null; if(!k.n) return {err:"Adding 0 doesn't change anything. Try a different number."};
    return {kind:"add", k:m[1]==="-"?neg(k):k, varFirst:false};
  }
  /* 7 - x, -x + 7: the letter has a minus sign in front (solved for -x, then flipped) */
  if((m=s.match(re("([+-]?)"+KT+"-"+v)))){
    const k=termR(m[2]); if(!k||!k.n) return null;
    return {kind:"add", k:m[1]==="-"?neg(k):k, varFirst:false, negVar:true};
  }
  if((m=s.match(re("-"+v+"([+-])"+KT)))){
    const k=termR(m[2]); if(!k||!k.n) return null;
    return {kind:"add", k:m[1]==="-"?neg(k):k, varFirst:true, negVar:true};
  }
  if((m=s.match(re("([+-]?)"+v)))){ if(m[1]!=="-") return solved; return {kind:"mul", a:R(-1)}; }
  if((m=s.match(re("([+-]?)\\((\\d+)\\/(\\d+)\\)\\*?"+v))) || (m=s.match(re("([+-]?)(\\d+)\\/(\\d+)\\*?"+v)))){
    if(!+m[2]||!+m[3]) return {err:"A fraction can't have 0 in it here. Try something like (2/3)"+v+" = 8."};
    return {kind:"frac", s:sg(m[1]), fp:+m[2], fq:+m[3], post:false};
  }
  if((m=s.match(re("([+-]?)(\\d+)"+v+"\\/(\\d+)")))){
    if(!+m[2]||!+m[3]) return {err:"A fraction can't have 0 in it here. Try something like 2"+v+"/3 = 8."};
    return {kind:"frac", s:sg(m[1]), fp:+m[2], fq:+m[3], post:true};
  }
  if((m=s.match(re("([+-]?)"+NUM+"\\*?"+v))) || (m=s.match(re("([+-]?)"+v+"\\*"+NUM)))){
    let a=numR(m[2]); if(m[1]==="-") a=neg(a);
    if(!a.n) return {err:"0 times "+v+" is always 0, so there's nothing to solve. Try a different number."};
    if(a.n===1 && a.d===1) return solved;
    return {kind:"mul", a:a};
  }
  if((m=s.match(re("([+-]?)"+v+"\\/([+-]?)"+NUM)))){
    const den=numR(m[3]); if(!den.n) return {err:"You can't divide by 0. Try a different number."};
    const sign=sg(m[1])*sg(m[2]);
    /* a minus sign in front of x is written down in the denominator instead: -x/7 becomes x/-7 */
    return {kind:"div", den:den, numNeg:false, denNeg:sign<0, m: sign<0 ? neg(den) : den, negMoved: m[1]==="-" && m[2]!=="-"};
  }
  return null;
}
function notReadable(vs,v){
  const body=vs.replace(/^[+-]/,"");
  if(new RegExp("^-"+v+"|-"+v+"$").test(vs) && /[+-]/.test(body))
    return v+" has a minus sign in front of it, so this one takes two steps. For one step, try something like 7 + "+v+" = 12.";
  if(/[+-]/.test(body)) return "That one takes two steps. This is for one-step equations, like 3"+v+" = 15 or "+v+" + 7 = 12.";
  return "I can't read that yet. Try something like (2/3)x = 8, x/4 = 5/6, 4j/6 = 2/3, or 3 1/5 b = 4/5.";
}
function parseEquation(raw){
  const rawLetter=(String(raw||"").match(/[a-zA-Z]/)||[])[0];
  let s=String(raw||"").toLowerCase()
    .replace(/[−–—]/g,"-").replace(/[×·•]/g,"*").replace(/÷/g,"/");
  /* mixed numbers (3 1/5): next to the letter it's the coefficient; otherwise it's a number on the
     letter's side (3 1/5 + b) or on the number side, sorted out once we know which side the letter is on */
  let mixA=null; const mixOn=[null,null];
  s=s.replace(/(\d+)[ \t]+(\d+)\s*\/\s*(\d+)(?=(\s*\*?\s*[a-z])?)/g,function(all,w,n,d,isCoef,off,str){
    w=+w; n=+n; d=+d; if(!d) return all;
    const m={w:w,n:n,d:d}, top=w*d+n;
    if(isCoef){ mixA=m; return "("+top+"/"+d+")"; }
    mixOn[str.slice(0,off).indexOf("=")>=0?1:0]=m; return top+"/"+d;
  });
  s=s.replace(/\s+/g,"");
  if(!s) return {err:"Type an equation first, like (2/3)x = 8."};
  s=s.replace(/(\d),(?=\d{3}(?!\d))/g,"$1");
  s=s.replace(/(^|[+\-=*])\(([+-]?\d+(?:\.\d*)?(?:\/\d+)?)\)/g,"$1$2");   /* x - (-3): drop the brackets round a number */
  for(let i=0;i<3;i++) s=s.replace(/\+-/g,"-").replace(/-\+/g,"-").replace(/--/g,"+").replace(/\+\+/g,"+");
  const parts=s.split("=");
  if(parts.length!==2 || !parts[0] || !parts[1]) return {err:"An equation needs one equals sign with something on each side, like 3x = 15."};
  const letters=s.match(/[a-z]/g)||[];
  if(!letters.length) return {err:"I don't see a variable. Use a letter, like x + 7 = 12."};
  if(letters.length>1) return {err: new Set(letters).size>1 ? "Use just one letter, like x + 7 = 12."
    : "The letter shows up more than once. This is for one-step equations, like x + 7 = 12."};
  const V=letters[0], varLeft=/[a-z]/.test(parts[0]);
  const vs=varLeft?parts[0]:parts[1], cs=varLeft?parts[1]:parts[0];
  const C=parseConst(cs);
  if(!C) return {err:"I can't read the number side. Use a number like 12, −4, 2.5 or 3/4."};
  const t=parseVarSide(stripParens(vs),V);
  if(!t) return {err:notReadable(vs,V)};
  if(t.err) return {err:t.err};
  const p=Object.assign({V:V, varLeft:varLeft, C:C, dec:/\./.test(s), divSign:/÷/.test(String(raw||""))}, t);
  if(mixA && p.kind!=="frac") mixA=null;
  const mixC=mixOn[varLeft?1:0];
  let mixK=mixOn[varLeft?0:1]; if(p.kind!=="add") mixK=null;
  p.mixA=mixA; p.mixC=mixC; p.mixK=mixK; p.mix=!!(mixA||mixC||mixK);
  if(rawLetter && rawLetter.toLowerCase()===V) p.V=rawLetter;
  if(p.kind==="add"){ p.move=absR(p.k); p.undo=p.k.n>0?"sub":"add"; p.T=subR(p.C,p.k); p.ans=p.negVar?neg(p.T):p.T; }
  if(p.kind==="mul"){ p.move=p.a; p.undo="div"; p.ans=divR(p.C,p.a); }
  if(p.kind==="div"){ p.move=p.m; p.undo="mul"; p.ans=mulR(p.C,p.m); }
  if(p.kind==="frac"){ p.move=R(p.s*p.fq,p.fp); p.undo="mul"; p.ans=mulR(p.C,p.move); }
  return {p:p};
}
/* what a student types: 7, -3, 2.5, .5, 7/2, 3 1/2 */
function parseVal(raw){
  let s=String(raw||"").trim().replace(/[−–—]/g,"-").replace(/\s+/g," ").replace(/(\d),(?=\d{3}(?!\d))/g,"$1");
  s=stripParens(s).trim(); let m;
  if((m=s.match(/^([+-]?)\s*(\d+) (\d+)\/(\d+)$/))){ if(!+m[4]) return null; const r=R(+m[2]*+m[4]+ +m[3], +m[4]); return m[1]==="-"?neg(r):r; }
  s=s.replace(/\s/g,"");
  if((m=s.match(/^([+-]?)(\d+)\/(\d+)$/))){ if(!+m[3]) return null; return R((m[1]==="-"?-1:1)*+m[2], +m[3]); }
  if((m=s.match(new RegExp("^([+-]?)"+NUM+"$")))){ const r=numR(m[2]); return m[1]==="-"?neg(r):r; }
  return null;
}

/* ================= written pieces ================= */
function kSignT(){ return P.k.n<0 ? MINUS : "+"; }
function kTxt(){ return P.varFirst ? kSignT()+" "+H(absR(P.k)) : H(P.k); }          /* + 7   or   7 */
function mvSign(){ return P.undo==="sub" ? MINUS : "+"; }
function mvTxt(){ return mvSign()+" "+H(P.move); }                                    /* − 7 */
function denShown(){ return (P.denNeg?MINUS:"")+H(P.den); }
function coefH(){ return (P.s<0?MINUS:"")+dfracH(P.fp,P.fq); }
function recipH(){ return (P.s<0?MINUS:"")+dfracH(P.fq,P.fp); }
function recipP(){ return P.s<0 ? "("+recipH()+")" : recipH(); }
function varTermH(){
  const p=P, V=p.V;

function runOrigCheck(){
  /* like the one-step drill: the top line of the work goes back to the problem as it was first written, everything
     under it steps back, and the answer floats up from the bottom line into every letter. The arithmetic follows right under it. */
  const pre=$("pre"), top=(!pre.hidden && pre.firstElementChild) || $("eq");
  if(!top || top.getAttribute("data-ck")==="1") return;
  top.setAttribute("data-ck","1");
  const V=S.mode==="vs" ? VS.V : P.V, A=origAns();
  const eq=$("eq"), greens=eq.querySelectorAll(".green");
  let src=greens.length ? greens[greens.length-1] : null;
  if(!src){ const cs=eq.querySelectorAll(".cell"); for(let i=cs.length-1;i>=0;i--){ const tx=cs[i].textContent.trim(); if(tx && tx.indexOf(V)<0 && tx!=="=" ){ src=cs[i]; break; } } }
  const cells=Array.prototype.filter.call(top.children,function(c){ return c.classList.contains("cell"); }).slice(0,3);
  if(cells.length<3) return;
  /* the problem as written, with the same room in it, so nothing slides */
  cells[0].innerHTML=origClean(ORIG.L); cells[2].innerHTML=origClean(ORIG.R);
  cells.forEach(function(c){ c.classList.remove("blue","fresh"); c.querySelectorAll(".arcs,.xslash").forEach(function(e){ e.remove(); }); });
  Array.prototype.forEach.call(top.children,function(el){ if(cells.indexOf(el)<0) el.classList.add("chk-fade"); });
  Array.prototype.forEach.call(pre.children,function(el){ if(el!==top) el.classList.add("chk-fade"); });
  if(!$("prev").hidden) $("prev").classList.add("chk-fade");
  if(top!==eq) eq.classList.add("chk-fade");
  /* the arithmetic, waiting right under the problem */
  const ls=CHK.slice(1), steps=document.createElement("div");
  steps.className="ck-steps"; steps.style.gridColumn="1 / -1";
  steps.innerHTML=ls.map(function(l,i){ return '<div class="ck-step">'+l+(i===ls.length-1?' <span class="green ck-tick">&#10003;</span>':'')+'</div>'; }).join("");
  cells[2].after(steps);
  /* every letter in the line */
  const letters=[];
  cells.forEach(function(cell){
    const nodes=[]; const w=document.createTreeWalker(cell, NodeFilter.SHOW_TEXT); let t;
    while((t=w.nextNode())) nodes.push(t);
    nodes.forEach(function(node){
      let i;
      while(node && (i=node.nodeValue.indexOf(V))>=0){
        const before=node.nodeValue.slice(0,i), after=node.splitText(i), rest=after.splitText(1);
        const sp=document.createElement("span"); sp.className="vl"; sp.textContent=V;
        after.parentNode.replaceChild(sp,after);
        /* a number or a fraction right in front of the letter is multiplying it, so the answer goes in parentheses */
        let prev=before.trim().slice(-1);
        if(!prev){ let ps=sp.previousSibling; while(ps && ps.nodeType===3 && !ps.nodeValue.trim()) ps=ps.previousSibling;
          if(ps && ps.nodeType===1 && /[0-9)]\s*$/.test(ps.textContent) && !/\b(lcdw|pp)\b/.test(ps.className||"")) prev="1"; }
        sp.setAttribute("data-paren", (/[0-9)]/.test(prev) || A.a.n<0 || (A.a.d>1 && !(ORIG.dec && terminates(A.a.d)))) ? "1" : "0");
        letters.push(sp); node=rest;
      }
    });
  });
  const work=document.querySelector(".work");
  /* the answers make the line longer: shrink a little if it would run off the screen, and keep it in view */
  const keepIn=function(){ fit(); work.scrollTop=0; };
  keepIn();
  const steps2=Array.prototype.slice.call(steps.children);
  const reveal=function(){
    lineUp(top,cells,steps,ls);
    steps2.forEach(function(st,i){ CHK_TIMERS.push(setTimeout(function(){ st.classList.add("in"); },700+i*1000)); });
  };
  const land=function(sp){ sp.innerHTML = sp.getAttribute("data-paren")==="1" ? "("+A.txt+")" : A.txt; sp.className="vl green"; };
  const reduce=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sl=$("stagelab"); sl.hidden=false; sl.textContent="Check it in the original problem";
  /* first the original problem on its own; the answer goes in when they're ready (the check is watched, not written) */
  const fly=function(){
    CK.wait=false;
    cells.forEach(function(c){ c.classList.remove("blue"); });
    if(S.mode==="vs") renderVSPrompt(); else renderPrompt();
    if(!letters.length || !src || reduce){ letters.forEach(land); keepIn(); reveal(); return; }
    const from=src.getBoundingClientRect();
    letters.forEach(function(sp,i){
      CHK_TIMERS.push(setTimeout(function(){
        const to=sp.getBoundingClientRect();
        const f=document.createElement("div"); f.className="chk-fly"; f.innerHTML=A.txt;
        f.style.fontSize=(parseFloat(getComputedStyle(sp).fontSize)*(top.getBoundingClientRect().width/(top.offsetWidth||1)))+"px";
        document.body.appendChild(f);
        const fw=f.offsetWidth, fh=f.offsetHeight;
        f.style.left=(from.left+from.width/2-fw/2)+"px"; f.style.top=(from.top+from.height/2-fh/2)+"px";
        void f.offsetWidth;
        f.style.transform="translate("+((to.left+to.width/2)-(from.left+from.width/2))+"px,"+((to.top+to.height/2)-(from.top+from.height/2))+"px)";
        sp.style.transition="opacity .3s";
        CHK_TIMERS.push(setTimeout(function(){ sp.style.opacity="0"; },450));
        CHK_TIMERS.push(setTimeout(function(){ f.remove(); sp.style.opacity=""; land(sp); keepIn(); if(i===letters.length-1) reveal(); },1000));
      },250+i*400));
    });
  };
  CK.wait=true; CK.go=fly;
  $("promptbar").innerHTML='<div class="row-between"><div class="prompt"><span>Check your answer in the original problem.</span></div>'
    +'<button class="next" id="ckGo" type="button">Put in the answer &rarr;<kbd class="nk">N</kbd></button></div>';
  $("ckGo").onclick=fly;

}

/* the one- and two-step problems check the same way as the clearing ones: the problem as it was written,
   the answer put in for the letter, and the arithmetic lined up under it */
function plainCheck(){
  if(S.mode!=="eq" || !P || ORIG) return;
  const ans=P.ans, ansT=asDec(ans) ? (ans.n<0?MINUS:"")+decStr(absR(ans)) : H(ans);
  const p1=TWO ? TWO.p1 : P;
  const sides=withP(p1,function(){ const v=varTermH(), c=H(p1.C); return p1.varLeft ? [v,c] : [c,v]; });
  let ls;
  if(TWO){
    const oldV=p1.V;
    ls=withP(p1,function(){
      p1.V=termHTMLof(TWO.info,ansT); const l1=eqH();
      p1.V=p1.kind==="add" ? PH(TWO.qval) : "("+H(TWO.qval)+")"; const l2=eqH();
      p1.V=oldV;
      /* a letter on its own (−x + 9) already reads as the number once it's put in, so that line isn't repeated */
      return TWO.info.ti===6 ? [l1,H(p1.C)+" = "+H(p1.C)] : [l1,l2,H(p1.C)+" = "+H(p1.C)];
    });
  } else {
    ls=[P.varLeft ? checkH()+" = "+H(P.C) : H(P.C)+" = "+checkH(), H(P.C)+" = "+H(P.C)];
  }
  ORIG={L:sides[0], R:sides[1], dec:!!P.dec, plain:true};
  CHK=ls;
}
function runPlainCheck(){

function focusG(){

function judgeG(typing){

/* ================= variables on both sides: get the variable terms on one side =================
   The student picks a variable term, picks the inverse operation, writes it under both sides,
   cancels, and combines. What's left is a one- or two-step equation, solved with the steps above.
   If the variable terms cancel completely, the student decides: infinite solutions or no solution. */
let VS=null;
const VS_ORDER=["copy","pick","op","move","movew","comb","combw","sol","done"];
function vsParseSide(str){
  const s=String(str).replace(/[−–—]/g,"-").replace(/\s+/g,"");
  const parts=s.match(/[+-]?[^+-]+/g)||[];
  return parts.map(function(p){
    const sg=p[0]==="-"?-1:1, body=p.replace(/^[+-]/,"");
    const m=body.match(/^(\d*\.?\d*)([a-zA-Z])$/);
    if(m){ const c=m[1]==="" ? R(1) : numR(m[1]); return {v:true, c: sg<0?neg(c):c, coefTxt:m[1], L:m[2]}; }
    const c=numR(body); return {v:false, c: sg<0?neg(c):c, txt:body};
  });
}
function vsNum(r){ const a=absR(r); return a.d===1 ? String(a.n) : (terminates(a.d) ? decStr(a) : a.n+"/"+a.d); }
/* a term as written: 6x, − 2x, + 12 (lead = first on its side, so no + in front) */
function vsTermTxt(t, lead){
  const a=absR(t.c);
  let body;
  if(t.v) body=(t.coefTxt!==undefined ? t.coefTxt : (a.n===1&&a.d===1 ? "" : vsNum(a)))+(t.L||VS.V);
  else body=t.txt!==undefined ? t.txt : vsNum(a);
  return lead ? (t.c.n<0?MINUS:"")+body : (t.c.n<0?MINUS:"+")+" "+body;
}
/* the same term typed out, for checking answers and for the next step: -2x, +12 */
function vsTermStr(t){
  const a=absR(t.c);
  const body = t.v ? ((a.n===1&&a.d===1) ? "" : vsNum(a))+(t.L||VS.V) : vsNum(a);
  return (t.c.n<0?"-":"+")+body;
}
function vsCols(){ return VS.L.length+1+VS.R.length; }
function vsVarIdx(side){ return VS[side].findIndex(function(t){ return t.v; }); }
function vsOther(){ return VS.pick==="L" ? "R" : "L"; }
function vsPicked(){ return VS[VS.pick][vsVarIdx(VS.pick)]; }
function vsMove(){ return {v:true, c:neg(vsPicked().c), L:VS.V}; }
function vsResultCoef(){ const o=vsOther(); return addR(VS[o][vsVarIdx(o)].c, neg(vsPicked().c)); }
function vsAfter(p){ return VS_ORDER.indexOf(VS.phase) >= VS_ORDER.indexOf(p); }
function vsConsts(side){ return VS[side].filter(function(t){ return !t.v; }).reduce(function(a,t){ return addR(a,t.c); }, R(0)); }
function vsConstTxt(side){ const c=vsConsts(side); return (c.n<0?MINUS:"")+vsNum(c); }

/* the check in the original problem, worked out from the problem as written */
function plainText(h){ return String(h).replace(/<[^>]+>/g,"").replace(/⟨\w+\|([^⟩]*)⟩/g,"$1").replace(/&middot;/g,"·").replace(/\s+/g," ").trim(); }
function evalSide(t, V, val){
  let e=String(t).replace(/[−–—]/g,"-").replace(/\[/g,"(").replace(/\]/g,")").replace(/\s+/g,"");
  e=e.replace(/(\d|\))(?=[(a-zA-Z])/g,"$1*").replace(new RegExp(V,"g"),"("+val+")");
  return Function('"use strict";return ('+e+')')();
}
function fmtN(x){ const r=Math.round(x*10000)/10000; return (r<0?MINUS:"")+String(Math.abs(r)); }
function autoCheck(L, Rt, V, ans){
  const val=ans.n/ans.d, vs=fmtN(val);
  /* x inside parentheses already has them: 3(x + 4) becomes 3(−2 + 4), not 3((−2) + 4) */
  const sub=function(t){ return t.replace(new RegExp("\\("+V,"g"),"(\u0001").replace(new RegExp(V,"g"),"("+vs+")").replace(/\u0001/g,vs); };
  return [sub(L)+" = "+sub(Rt), fmtN(evalSide(L,V,val))+" = "+fmtN(evalSide(Rt,V,val))];
}

function startVS(eqStr, opts){
  opts=opts||{};
  clearCheck(); S.idle=false; S.mode="vs"; P=null; TWO=null; $("eqErr").hidden=true;
  $("prev").hidden=true; $("prev").innerHTML="";
  const sides=String(eqStr).split("=");
  const L=vsParseSide(sides[0]), Rt=vsParseSide(sides[1]);
  const V=(String(eqStr).match(/[a-zA-Z]/)||["x"])[0];
  const sum=function(ts,isV){ return ts.filter(function(t){ return t.v===isV; }).reduce(function(a,t){ return addR(a,t.c); }, R(0)); };
  const coef=subR(sum(L,true),sum(Rt,true)), rest=subR(sum(Rt,false),sum(L,false));
  VS={V:V, L:L, R:Rt, eq:eqStr, pick:null, phase: opts.pre ? "pick" : "copy", v:{}, missed:false, note:"", busy:false, dec:!!opts.dec,
      kind: coef.n!==0 ? "one" : (rest.n===0 ? "inf" : "none"), ans: coef.n!==0 ? divR(rest,coef) : null};
  VS.special = VS.kind!=="one";
  VS.fromSimplify = !!opts.pre;
  PREB=opts.pre||null;
  const orig = opts.orig ? {L:plainText(opts.orig.L), R:plainText(opts.orig.R)} : {L:sides[0].trim().replace(/-/g,MINUS), R:sides[1].trim().replace(/-/g,MINUS)};
  CHK = opts.check || (VS.ans ? autoCheck(orig.L, orig.R, V, VS.ans) : null);
  renderVS(true);
}
function vsRows(o){
  o=o||{};
  const after=function(p){ return o.plain ? VS_ORDER.indexOf(p)<=VS_ORDER.indexOf("comb") : vsAfter(p); };
  const sp=VS.special, other=VS.pick ? vsOther() : null;
  const combNow=!o.plain && VS.phase==="comb";
  const cancels=function(side){ return side===VS.pick || sp; };
  /* the top line */
  const rowCls=(!o.plain && VS.phase==="copy") ? "blue fresh" : "";
  const top=function(side){
    return VS[side].map(function(t,i){
      let txt=vsTermTxt(t,i===0), cls=rowCls;
      if(t.v && !o.plain && VS.phase==="pick" && !TYPEMOVE) txt='<span class="tgt" role="button" tabindex="0" data-s="'+side+'">'+txt+'</span>';
      else if(t.v && !o.plain && VS.phase==="op" && side===VS.pick) txt='<span class="tgt picked">'+txt+'</span>';
      if(t.v && VS.pick && after("comb") && cancels(side)) cls+=" struck";
      if(t.v && combNow && side===other && !sp) txt='<span class="hk hl1">'+txt+'</span>';
      return cell(txt, cls.trim());
    }).join("");
  };
  let h=top("L")+cell("=","eqsign")+top("R");
  if(!o.plain && TYPEMOVE && VS.phase==="pick"){
    /* the box sits under a letter term, where the move gets written: the smaller one, the easier one to move */
    const ab=function(sd){ const t=VS[sd][vsVarIdx(sd)]; return t ? Math.abs(t.c.n/t.c.d) : 1e9; };
    const ts=ab("L")<ab("R") ? "L" : "R";
    const und=function(side){ return VS[side].map(function(t){
      return (t.v && side===ts) ? cell('<span class="dofl"><input id="vsDo" class="box wide" value="'+String(VS.v.doIt||"").replace(/"/g,"&quot;")+'" autocomplete="off" spellcheck="false" aria-label="what you do to both sides"><span class="dolbl">Do to both sides</span></span>') : cell("");
    }).join(""); };
    return h+und("L")+cell("")+und("R");
  }
  if(!VS.pick || !after("move")) return h;
  /* the line under it: the move, on both sides */
  const mv=vsMove(), moveTxt=vsTermTxt(mv,false);
  const under=function(side){
    return VS[side].map(function(t){
      if(!t.v) return cell("");
      let cls="";
      let txt=moveTxt;
      if(!o.plain && VS.phase==="move") txt='<span class="sgn blue">'+(mv.c.n<0?MINUS:"+")+' <input id="'+(side==="L"?"vsA":"vsB")+'" class="box" value="'+String(VS.v.move||"").replace(/"/g,"&quot;")+'" autocomplete="off" spellcheck="false" aria-label="what you add or subtract"></span>';
      if(!o.plain && VS.phase==="movew") cls="blue fresh";
      if(after("comb") && cancels(side)) cls+=" struck";
      if(combNow && side===other && !sp) txt='<span class="hk hl1">'+txt+'</span>';
      return cell(txt, cls.trim());
    }).join("");
  };
  h+=under("L")+cell("")+under("R");
  h+='<div class="rule'+((!o.plain && VS.phase==="movew") ? " blue fresh" : "")+'"></div>';
  if(o.noResult || !after("comb")) return h;
  /* what's left */
  const resCls=(!o.plain && VS.phase==="combw") ? "blue fresh" : "";
  const result=function(side){
    const keepVar = side===other && !sp;
    const shown=VS[side].filter(function(t){ return !t.v || keepVar; });
    let first=true;
    return VS[side].map(function(t){
      if(t.v && !keepVar){
        if(!shown.length){ first=false; return cell("0",resCls); }
        return cell("");
      }
      let txt;
      if(t.v){
        const rt={v:true, c:vsResultCoef(), L:VS.V};
        txt = (!o.plain && VS.phase==="comb")
          ? '<input id="vsC" class="box hlb1" value="'+String(VS.v.comb||"").replace(/"/g,"&quot;")+'" autocomplete="off" spellcheck="false" aria-label="combined term">'
          : vsTermTxt(rt, first);
      } else txt=vsTermTxt(t, first);
      first=false;
      return cell(txt, resCls);
    }).join("");
  };
  h+=result("L")+cell("=","eqsign"+(resCls?" "+resCls:""))+result("R");
  return h;
}
function renderVS(focus){
  const eq=$("eq");
  eq.className="eq vsgrid"; eq.style.gridTemplateColumns="repeat("+vsCols()+", auto)";

function renderVSPrompt(){
  const pb=$("promptbar"), V=VS.V;

    +'<button class="next" id="vsNext" type="button">'+(lbl||"Next &rarr;")+'<kbd class="nk">N</kbd></button></div>'; };

function vsMiss(note){
  VS.missed=true; VS.note=note; renderVSPrompt(); fit();
}
function vsPick(side){
  if(VS.phase!=="pick") return;
  VS.pick=side; VS.phase="op"; VS.missed=false; renderVS();
}
function vsOp(op){
  if(VS.phase!=="op") return;
  const want=vsPicked().c.n>0 ? "sub" : "add";
  if(op===want){ VS.phase="move"; VS.missed=false; renderVS(); return; }
  vsMiss(op==="mul"||op==="div" ? "Not yet. To move the "+VS.V+" term, add or subtract it."
                                 : "That would give you more "+VS.V+"'s instead of canceling them. Do the opposite.");

}
function vsJudgeDo(typing){

  const V=VS.V, t=raw.toLowerCase().replace(/[−–—]/g,"-").replace(/[×*·]/g,"*").replace(/÷/g,"/").replace(/\s+/g,"");
  const m=t.match(/^([+\-*\/])\(?([+-]?)(\d*(?:\.\d+)?)([a-z]?)\)?$/);
  let side=null;
  if(m && (m[1]==="+"||m[1]==="-") && m[4]===V.toLowerCase()){
    let c=m[3]==="" ? R(1) : numR(m[3]);
    if((m[1]==="-")!==(m[2]==="-")) c=neg(c);
    ["L","R"].forEach(function(sd){ if(side) return; const i=vsVarIdx(sd); if(i>=0 && same(c,neg(VS[sd][i].c))) side=sd; });
  }
  if(side) return vsOk(function(){ VS.pick=side; VS.phase="movew"; renderVS(); });
  if(typing) return;

  const small=["L","R"].map(function(sd){ return VS[sd][vsVarIdx(sd)]; }).sort(function(a,b){ return Math.abs(a.c.n/a.c.d)-Math.abs(b.c.n/b.c.d); })[0];
  const want=vsTermStr({v:true, c:neg(small.c), L:V}).replace(/^\+/,"+").replace(/-/g,MINUS);
  let note;
  if(!m) note="Type a sign and a "+V+" term, like "+MINUS+"2"+V+".";
  else if(m[1]==="*"||m[1]==="/") note="Not yet. To move a "+V+" term, add or subtract it.";
  else if(m[4]!==V.toLowerCase()) note="Move a "+V+" term first. The numbers come after.";

function vsHandoff(){
  const other=vsOther(), coef=vsResultCoef();

    const ts=[];
    VS[side].forEach(function(t){ if(t.v){ if(side===other) ts.push({v:true, c:coef, L:VS.V}); } else ts.push(t); });
    if(!ts.length) return "0";

/* is this typed equation one with the variable on both sides? */
function isBothSides(raw){
  const s=String(raw||"");
  if(/[()\[\]]/.test(s)) return false;
  const parts=s.split("=");
  if(parts.length!==2) return false;
  if(!/[a-zA-Z]/.test(parts[0]) || !/[a-zA-Z]/.test(parts[1])) return false;
  const letters=(s.match(/[a-zA-Z]/g)||[]).map(function(c){ return c.toLowerCase(); });
  if(new Set(letters).size!==1) return false;
  const ok=function(side){ const ts=vsParseSide(side); return ts.length>0 && ts.length<=3 && ts.filter(function(t){ return t.v; }).length===1 && ts.every(function(t){ return t.c && !isNaN(t.c.n); }); };
  return ok(parts[0]) && ok(parts[1]);
}

/* ================= two-step equations =================
   A two-step problem is solved as two one-step problems in a row:
   step 1 treats the letter's whole term (6x, x/4, (1/2)x, or a group like (F − 32)) as one piece and undoes the + or −
   (or, for a group, the multiplying); step 2 solves what's left (6x = 324). */
let TWO=null;
function withP(p,fn){ const keep=P; P=p; try{ return fn(); } finally { P=keep; } }
function numText(r,dec){ if(r.d===1) return String(r.n); if(dec && terminates(r.d)) return decStr(r); return (r.n<0?"-":"")+Math.abs(r.n)+"/"+r.d; }
const TERM_PATS=[
  /\(([a-zA-Z])([+-])(\d+(?:\.\d+)?)\)/,        /* (F - 32) */
  /\((\d+)\/(\d+)\)\*?([a-zA-Z])/,               /* (1/5)a */
  /(\d+)\/(\d+)\*?([a-zA-Z])/,                    /* 1/5a */
  /(\d+)([a-zA-Z])\/(\d+)/,                        /* 4x/6 */
  /([a-zA-Z])\/([+-]?)(\d+(?:\.\d+)?)/,           /* x/4, p/-5 */
  /(\d+(?:\.\d+)?)\*?([a-zA-Z])/,                  /* 6x, 2.5w */
  /([a-zA-Z])/                                     /* x */
];
/* the letter's term as written; rep puts a number in for the letter (for the check) */
function termHTMLof(info,rep){
  const m=info.m, t=info.ti;
  const inMul=function(L){ return rep ? "("+rep+")" : L; };
  if(t===0) return "("+(rep||m[1])+" "+(m[2]==="-"?MINUS:"+")+" "+m[3]+")";
  if(t===1||t===2) return '<span class="tpair">'+dfracH(m[1],m[2])+inMul(m[3])+'</span>';
  if(t===3) return dfracH(m[1]+inMul(m[2]),m[3]);
  if(t===4) return dfracH(rep ? (rep.indexOf(MINUS)===0?"("+rep+")":rep) : m[1], (m[2]==="-"?MINUS:"")+m[3]);
  if(t===5) return m[1]+inMul(m[2]);
  return rep ? "("+rep+")" : m[1];
}
function parseTwo(raw){
  const r0=String(raw||"");
  if(/\d\s+\d+\s*\/\s*\d/.test(r0)) return null;          /* mixed numbers: leave those to the one-step reader */
  const s=r0.replace(/[−–—]/g,"-").replace(/[×·•]/g,"*").replace(/÷/g,"/").replace(/\s+/g,"").replace(/(\d),(?=\d{3}(?!\d))/g,"$1");
  const parts=s.split("=");
  if(parts.length!==2 || !parts[0] || !parts[1]) return null;
  const letters=s.match(/[a-zA-Z]/g)||[];
  if(letters.length!==1) return null;
  const L=letters[0], varLeft=/[a-zA-Z]/.test(parts[0]);
  const vs=varLeft?parts[0]:parts[1], cs=varLeft?parts[1]:parts[0];
  let m=null, ti=-1;
  for(let i=0;i<TERM_PATS.length;i++){ m=vs.match(TERM_PATS[i]); if(m){ ti=i; break; } }
  if(!m) return null;
  const hold="qzuk".split("").filter(function(c){ return c!==L.toLowerCase(); })[0];
  const side1=vs.slice(0,m.index)+hold+vs.slice(m.index+m[0].length);
  const r1=parseEquation(varLeft ? side1+"="+cs : cs+"="+side1);
  if(r1.err) return null;
  const p1=r1.p, dec=p1.dec;
  let s2, qval;
  if(p1.kind==="add"){
    if(ti===6 && !p1.negVar) return null;                   /* x + 7 = 12 is one step */
    const termTxt = ti===0 ? m[0] : m[0];
    const lhs=(p1.negVar?"-":"")+termTxt;
    s2 = varLeft ? lhs+"="+numText(p1.T,dec) : numText(p1.T,dec)+"="+lhs;
    qval = p1.negVar ? neg(p1.T) : p1.T;
  } else {
    if(ti!==0) return null;                                  /* 3x = 12 is one step */
    const inner=m[1]+m[2]+m[3];
    s2 = varLeft ? inner+"="+numText(p1.ans,dec) : numText(p1.ans,dec)+"="+inner;
    qval = p1.ans;
  }
  const r2=parseEquation(s2);
  if(r2.err) return null;
  const info={ti:ti, m:m, op:m[2]};
  p1.V=termHTMLof(info,null); p1.two=1;
  return {p1:p1, s2:s2, info:info, qval:qval, dec:dec, varLeft:varLeft};
}

function rint(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function fmt(n){ return n<0 ? "-"+Math.abs(n) : String(n); }
function coprime(q,lo,hi){ let p=rint(lo,hi), t=0; while((gcd(p,q)!==1||p===q) && t++<50) p=rint(lo,hi); return p; }
/* a number as a student would type it: 7, -3/4, or a mixed number like -2 1/3 */
function typed(r,allowMixed){
  const sg=r.n<0?"-":"", a=Math.abs(r.n);
  if(r.d===1) return sg+a;
  if(allowMixed && a>r.d) return sg+Math.floor(a/r.d)+" "+(a%r.d)+"/"+r.d;
  return sg+a+"/"+r.d;
}
function randomEq(){
  const V=pick(["x","y","n","k","m","w","t","b"]);
  const nz=function(lo,hi){ let v=0; while(!v) v=rint(lo,hi); return v; };
  const x=nz(-9,9), a=nz(-9,9);
  let c=nz(-9,9); while(c===a) c=nz(-9,9);
  const b=rint(-15,15), d=(a-c)*x+b;
  const term=function(k,lead){ const t=(Math.abs(k)===1?"":Math.abs(k))+V; return lead ? (k<0?"-":"")+t : (k<0?" - ":" + ")+t; };
  const num=function(k,lead){ return lead ? String(k) : (k<0?" - ":" + ")+Math.abs(k); };
  const side=function(k,cst){
    if(!cst) return term(k,true);
    return Math.random()<0.7 ? term(k,true)+num(cst,false) : num(cst,true)+term(k,false);
  };
  return side(a,b)+" = "+side(c,d);
}
/* Give me one: a new fraction equation, cleared the same way as the worksheet ones */
function genFrac(){
  const ri=function(a,b){ return a+Math.floor(Math.random()*(b-a+1)); };
  const pk=function(a){ return a[Math.floor(Math.random()*a.length)]; };
  const lcm=function(a,b){ return a/gcd(a,b)*b; };
  for(let tries=0; tries<500; tries++){
    const V=pk(["x","x","a","b","n","m","t","y","k"]), kind=ri(1,4);
    const DEN=[2,3,4,5,6,8,10];
    /* a term: v = variable term with coefficient c, otherwise a number c */
    const vt=function(){ const d=pk(DEN); let n=Math.random()<0.7?1:ri(2,d+3); if(gcd(n,d)>1) n=1; return {v:true, c:R(n,d)}; };
    const ct=function(){ return {v:false, c:R(Math.random()<0.25?-ri(1,9):ri(1,15))}; };
    let Ls, Rs;
    if(kind===1){ Ls=[vt(),vt()]; Rs=[null]; }                       /* x/a + x/b = c        */
    else if(kind===2){ Ls=[vt(),vt(),ct()]; Rs=[null]; }             /* x/a + x/b + c = d    */
    else if(kind===3){ Ls=[vt(),ct()]; Rs=[vt(),null]; }             /* x/a + c = x/b + d    */
    else { Ls=[vt(),null]; Rs=[{v:true,c:R(Math.random()<0.5?1:ri(2,3))}]; }   /* x/a + c = x  */
    const x=R(ri(-12,15)); if(x.n===0) continue;
    const val=function(ts){ return ts.filter(Boolean).reduce(function(s,t){ return addR(s, t.v?mulR(t.c,x):t.c); },R(0)); };
    /* the one missing number balances the equation at the answer */
    const holeL=Ls.indexOf(null), holeR=Rs.indexOf(null);
    const k = holeL>=0 ? addR(val(Rs),neg(val(Ls))) : addR(val(Ls),neg(val(Rs)));
    if(k.n===0 || Math.abs(k.n)>60) continue;
    if(holeL>=0) Ls[holeL]={v:false,c:k}; else Rs[holeR]={v:false,c:k};
    const all=Ls.concat(Rs), dens=all.map(function(t){ return t.c.d; });
    if(k.d>1 && DEN.indexOf(k.d)<0) continue;
    if(Ls[0].c.d===1 && Ls[1] && Ls[1].c.d===1) continue;
    const L=dens.reduce(lcm,1); if(L<2 || L>40) continue;
    /* after clearing, combined: the coefficient and number on each side */
    const sum=function(ts,isV){ return ts.filter(function(t){ return t.v===isV; }).reduce(function(s,t){ return s+t.c.n*L/t.c.d; },0); };
    const cv={L:sum(Ls,true),R:sum(Rs,true)}, cc={L:sum(Ls,false),R:sum(Rs,false)};
    if(cv.L===cv.R) continue;
    const hasC={L:Ls.some(function(t){ return !t.v; }), R:Rs.some(function(t){ return !t.v; })};
    if((hasC.L && cc.L===0) || (hasC.R && cc.R===0)) continue;
    if(Math.abs(cv.L)>80 || Math.abs(cv.R)>80 || Math.abs(cc.L)>400 || Math.abs(cc.R)>400) continue;
    /* the worksheet's term format */
    const fmt=function(t){
      const a=Math.abs(t.c.n), o={neg:t.c.n<0};
      if(t.v){ o.top=(a===1?"":a)+V; if(t.c.d>1) o.den=t.c.d; }
      else { o.top=String(a); if(t.c.d>1) o.den=t.c.d; }
      return o;
    };
    const tv=function(t){ const n=t.c.n*L/t.c.d; return t.v ? (n===1?"":n===-1?"-":n)+V : String(n); };
    const spec={V:V, lcd:L, L:Ls.map(fmt), R:Rs.map(fmt), res:{L:Ls.map(tv), R:Rs.map(tv)}, rk:{L:[],R:[]}, stem:"Solve for "+V+".", more:[]};
    /* combine like terms where a side has two of a kind */
    const sideTxt=function(S){
      const p=[]; if(cv[S]!==0) p.push((cv[S]===1?"":cv[S]===-1?"-":cv[S])+V); if(hasC[S]) p.push(String(cc[S]));
      return p.join(" + ").replace(/\+ -/g,"- ");
    };
    const st={lab:"Then combine like terms", L:"", R:"", use:{}, boxes:{}, prompt:"Combine like terms."+KEYS, hint:""};
    let needC=false; const hints=[];
    ["L","R"].forEach(function(S){
      const ts=S==="L"?Ls:Rs, nv=ts.filter(function(t){ return t.v; }).length, nc=ts.filter(function(t){ return !t.v; }).length;
      ts.forEach(function(t,i){ spec.rk[S][i]=(t.v?"v":"c")+S; });
      if(nv<2 && nc<2){ st[S]=sideTxt(S).replace(/-/g,M); return; }
      needC=true; const parts=[];
      if(cv[S]!==0){ st.boxes["V"+S]={t:"term",w:(cv[S]===1?"":cv[S]===-1?"-":cv[S])+V,lead:true}; st.use["V"+S]=["v"+S]; parts.push("{V"+S+"}"); }
      if(hasC[S]){ st.boxes["C"+S]= parts.length ? {t:"sgn",w:String(cc[S])} : {t:"num",w:String(cc[S])}; st.use["C"+S]=["c"+S]; parts.push("{C"+S+"}"); }
      const vs=ts.filter(function(t){ return t.v; }).map(tv);
      if(nv>1) hints.push(vs.join(" + ").replace(/\+ -/g,"− ").replace(/-/g,M)+" = "+st.boxes["V"+S].w.replace(/-/g,M));
      st[S]=parts.join(" ");
    });
    if(needC){ st.hint=hints.join(". ")+"."; spec.more.push(st); }
    /* the check, in the original problem */
    const fr=function(r){ const a=Math.abs(r.n); return (r.n<0?M:"")+(r.d===1?String(a):Fr(String(a),String(r.d))); };
    const xs=x.n<0 ? "("+M+Math.abs(x.n)+")" : String(x.n);
    const join=function(parts){ return parts.map(function(h,i){ return i===0 ? h.t : (h.neg?" "+M+" ":" + ")+h.t; }).join(""); };
    const subSide=function(ts){ return join(ts.map(function(t){
      const a=Math.abs(t.c.n);
      let top = t.v ? (a===1 ? (t.c.d>1 ? String(x.n).replace("-",M) : xs) : a+xs) : String(a);
      return {neg:t.c.n<0, t:t.c.d>1 ? Fr(top,String(t.c.d)) : top};
    })); };
    /* each value keeps the sign that sits in front of its term in the problem */
    const valSide=function(ts){ return ts.map(function(t,i){ let v=t.v?mulR(t.c,x):t.c;
      if(i===0) return fr(v);
      if(t.c.n<0){ v=neg(v); return v.n<0 ? " "+M+" ("+fr(v)+")" : " "+M+" "+fr(v); }
      return v.n<0 ? " + ("+fr(v)+")" : " + "+fr(v); }).join(""); };
    spec.check=[subSide(Ls)+" = "+subSide(Rs), valSide(Ls)+" = "+valSide(Rs), fr(val(Ls))+" = "+fr(val(Rs))];
    if((Ls.length===1 && Rs.length===1) || spec.check[1]===spec.check[0]) spec.check.splice(1,1);
    spec.then=sideTxt("L")+" = "+sideTxt("R");
    spec.vs = cv.L!==0 && cv.R!==0;
    return frClear(spec);
  }
  return GUIDE["f3"];
}
function randomStart(){ Q=0; PROB++; ORIG=null; GUIDE.rand=genFrac(); $("eqIn").value=""; startG("rand"); }

/* ================= wiring ================= */
function init(){
  $("entry").addEventListener("submit",function(e){ e.preventDefault(); Q=0; PROB++; ORIG=null; const v=$("eqIn").value; if(isBothSides(v)) startVS(v); else start(v,true); });
  $("randBtn").onclick=randomStart;
  $("crossBtn").onclick=toggleCross; $("crossBtn").textContent=crossBtnText(); $("crossBtn").classList.toggle("off",!CROSS);
  /* clicking into the equation box clears it, so a new one can be typed straight in */
  $("eqIn").addEventListener("focus",function(){ if(!S.idle) this.value=""; });
  /* keyboard: A/+ S/- M/x D/ pick the move; Enter or N moves on after writing a step */
  document.addEventListener("keydown",function(e){
    if(e.ctrlKey||e.metaKey||e.altKey||S.idle) return;
    const a=document.activeElement;
    if(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA")) return;
    if(CK.wait && (e.key==="n"||e.key==="N"||e.key==="Enter")){ e.preventDefault(); CK.go(); return; }
    if(S.mode==="vs"){
      if((e.key==="n"||e.key==="N"||e.key==="Enter") && $("vsNext")){ e.preventDefault(); $("vsNext").click(); return; }
      if(VS && VS.phase==="op"){
        const map={"a":"add","+":"add","s":"sub","-":"sub","−":"sub","m":"mul","x":"mul","*":"mul","d":"div","/":"div"};
        const k=map[e.key.toLowerCase()];
        if(k){ e.preventDefault(); vsOp(k); }
      }
      return;
    }
    if(S.mode==="own"){
      if((e.key==="n"||e.key==="N"||e.key==="Enter") && $("ownNext")){ e.preventDefault(); $("ownNext").click(); }
      return;
    }
    if(S.mode==="g"){
      if((e.key==="n"||e.key==="N"||e.key==="Enter") && $("gNext")){ e.preventDefault(); $("gNext").click(); }
      return;
    }
    if(e.key==="Enter" && !(a && a.tagName==="BUTTON")){
      if(S.step>=7){ e.preventDefault(); randomStart(); return; }
      if(S.phase==="write"){ e.preventDefault(); goNext(); return; }
    }
    if(e.key==="n" || e.key==="N"){
      const btn=$("wrote")||$("nextBtn");
      if(btn){ e.preventDefault(); btn.click(); return; }
    }
    if(S.step===2 && S.phase==="ask"){
      const map={"a":"add","+":"add","s":"sub","-":"sub","−":"sub","m":"mul","x":"mul","*":"mul","d":"div","/":"div"};
      const k=map[e.key.toLowerCase()];
      if(k){ e.preventDefault(); judgeOp(k); }
    }
  });
  window.addEventListener("resize",function(){ alignPrev(); fit(); placeBox(); });
  startQ(1,false);
}
if(typeof document!=="undefined" && document.getElementById("eq")) init();
</script>
